name: Create and publish Habo Client v0.1.3

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-v0.1.3.yml

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version_ref_name: v0.1.3
      upload_artifacts: true

  publish:
    name: Sign and publish v0.1.3 updater assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v6
        with:
          name: build-linux
          path: dist/linux

      - uses: actions/download-artifact@v6
        with:
          name: build-windows
          path: dist/windows

      - name: Sign updater payloads
        env:
          HABO_UPDATE_SIGNING_KEY: ${{ secrets.HABO_UPDATE_SIGNING_KEY }}
        run: |
          go run ./scripts/sign-updates.go \
            dist/linux/update-linux-amd64.gz \
            dist/windows/update-windows-amd64.exe.gz

      - name: Create release and upload signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.3 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Habo Client v0.1.3" \
              --notes "Fixes private market scans being rejected when Albion server detection briefly becomes unavailable during join or zone transitions. Habo Client now keeps the last valid server, re-resolves the latest game-server IP before upload, and avoids sending invalid server IDs."
          fi

          gh release upload v0.1.3 \
            dist/linux/update-linux-amd64.gz \
            dist/linux/update-linux-amd64.gz.sig \
            dist/windows/update-windows-amd64.exe.gz \
            dist/windows/update-windows-amd64.exe.gz.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
