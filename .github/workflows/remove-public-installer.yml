name: Remove public Habo Client installer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/remove-public-installer.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove public Windows installer from v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'habo-client-amd64-installer.exe'; then
            gh release delete-asset v0.1.0 habo-client-amd64-installer.exe --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "Installer asset already absent"
          fi
