name: Create and publish Habo Client v0.1.5

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-v0.1.5.yml

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version_ref_name: v0.1.5
      upload_artifacts: true

  publish:
    name: Sign and publish v0.1.5 updater assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v6
        with:
          name: build-linux
          path: dist/linux

      - uses: actions/download-artifact@v6
        with:
          name: build-windows
          path: dist/windows

      - name: Sign updater payloads
        env:
          HABO_UPDATE_SIGNING_KEY: ${{ secrets.HABO_UPDATE_SIGNING_KEY }}
        run: |
          go run ./scripts/sign-updates.go \
            dist/linux/update-linux-amd64.gz \
            dist/windows/update-windows-amd64.exe.gz

      - name: Create release and upload signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.5 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Habo Client v0.1.5" \
              --notes "Reliability release for Habo market uploads. Adds a durable local upload queue, batching, paced sends, Retry-After handling for rate limits, exponential retry for temporary network/server failures, bounded queue retention, account-safe queued data, and preserved scan timestamps so delayed retries cannot look artificially fresh."
          fi

          gh release upload v0.1.5 \
            dist/linux/update-linux-amd64.gz \
            dist/linux/update-linux-amd64.gz.sig \
            dist/windows/update-windows-amd64.exe.gz \
            dist/windows/update-windows-amd64.exe.gz.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
