name: Publish Habo Client v0.1.9

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-v0.1.9.yml

permissions:
  contents: write

jobs:
  build:
    name: Build signed-updater payload
    uses: ./.github/workflows/build.yml
    with:
      version_ref_name: v0.1.9
      upload_artifacts: true

  installer:
    name: Export v0.1.9 Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build v0.1.9 Windows installer
        env:
          HABO_VERSION: v0.1.9
        run: make build-windows
      - name: Upload private installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: habo-client-v0.1.9-installer
          path: habo-client-amd64-installer.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify signature and publish v0.1.9
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v6
        with:
          name: build-windows
          path: dist/windows
      - name: Sign Windows updater payload
        env:
          HABO_UPDATE_SIGNING_KEY: ${{ secrets.HABO_UPDATE_SIGNING_KEY }}
        run: |
          test -s dist/windows/update-windows-amd64.exe.gz
          gzip -t dist/windows/update-windows-amd64.exe.gz
          go run ./scripts/sign-updates.go dist/windows/update-windows-amd64.exe.gz
      - name: Verify signature against the client's embedded public key
        shell: bash
        run: |
          cat > /tmp/habo-verify-release.go <<'GO'
          package main
          import (
            "crypto/ed25519"
            "encoding/base64"
            "fmt"
            "os"
            "regexp"
            "strings"
          )
          func main() {
            src, err := os.ReadFile("third_party/go-githubupdate/updater/githubupdate.go")
            if err != nil { panic(err) }
            m := regexp.MustCompile(`updatePublicKeyBase64\s*=\s*"([^"]+)"`).FindSubmatch(src)
            if len(m) != 2 { panic("update public key not found in source") }
            pk, err := base64.StdEncoding.DecodeString(string(m[1]))
            if err != nil { panic(err) }
            payload, err := os.ReadFile("dist/windows/update-windows-amd64.exe.gz")
            if err != nil { panic(err) }
            sigFile, err := os.ReadFile("dist/windows/update-windows-amd64.exe.gz.sig")
            if err != nil { panic(err) }
            sig, err := base64.StdEncoding.DecodeString(strings.TrimSpace(string(sigFile)))
            if err != nil { panic(err) }
            if !ed25519.Verify(pk, payload, sig) { panic("update signature fails embedded public-key validation") }
            fmt.Println("Signed updater verified against public key embedded in Habo Client")
          }
          GO
          go run /tmp/habo-verify-release.go
      - name: Publish complete release atomically (draft first)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.9 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v0.1.9 already exists; refusing to overwrite it" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.9 >/dev/null 2>&1; then
            echo "v0.1.9 tag already exists; refusing duplicate publish" >&2
            exit 1
          fi
          gh release create v0.1.9 \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Habo Client v0.1.9" \
            --notes "Security maintenance release: updated the Go toolchain to 1.26.10 to address GO-2026-6809 (crypto/x509). Habo Client now builds and publishes Windows update payloads only. Existing installations receive this update through the signed automatic updater." \
            --draft \
            dist/windows/update-windows-amd64.exe.gz \
            dist/windows/update-windows-amd64.exe.gz.sig
          gh release edit v0.1.9 --repo "$GH_REPO" --draft=false
          gh release view v0.1.9 --repo "$GH_REPO" --json tagName,isDraft,isPrerelease,assets
