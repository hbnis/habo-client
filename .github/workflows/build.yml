# .github/workflows/build.yml
#
# Reusable build workflow, shared by test-build.yml (push/PR) and
# release.yml (release published). Normal CI builds everything for validation
# but does not publish downloadable binaries. Release callers may opt in to
# short-lived updater payload artifacts used by the signing/publish job.

on:
  workflow_call:
    inputs:
      version_ref_name:
        description: Optional explicit version/tag to embed in release builds
        required: false
        type: string
        default: ''
      upload_artifacts:
        description: Upload short-lived updater payloads for a release job
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            release_artifacts: update-linux-amd64.gz
          - os: windows
            runner: ubuntu-latest
            release_artifacts: update-windows-amd64.exe.gz
          - os: darwin
            runner: macos-latest
            release_artifacts: update-darwin-amd64.gz
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        env:
          HABO_VERSION: ${{ inputs.version_ref_name }}
        run: make build-${{ matrix.os }}

      # Runs only on the linux leg, which already has libpcap-dev and the
      # frontend build (both required by the root package's cgo imports
      # and //go:embed directive) from the build step above - no need to
      # duplicate that setup in a separate job.
      - name: Vet
        if: matrix.os == 'linux'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'linux'
        run: go test ./...

      - name: Test signed updater module
        if: matrix.os == 'linux'
        working-directory: third_party/go-githubupdate
        run: go test ./...

      - name: Upload release updater payload
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.release_artifacts }}
          retention-days: 1
