# .github/workflows/build.yml
# Reusable Windows-only client build for CI and releases.
# Go package validation on Linux is handled by test-build.yml without building
# or packaging an unused Linux executable.

on:
  workflow_call:
    inputs:
      version_ref_name:
        description: Optional explicit version/tag to embed in release builds
        required: false
        type: string
        default: ''
      upload_artifacts:
        description: Upload short-lived Windows updater payload for a release job
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Windows client
        env:
          HABO_VERSION: ${{ inputs.version_ref_name }}
        run: make build-windows

      - name: Upload Windows updater payload
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-windows
          path: update-windows-amd64.exe.gz
          retention-days: 1
