name: Create and publish Habo Client v0.1.7

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-v0.1.7.yml

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version_ref_name: v0.1.7
      upload_artifacts: true

  installer:
    name: Export v0.1.7 Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build v0.1.7 Windows installer
        env:
          HABO_VERSION: v0.1.7
        run: make build-windows

      - name: Upload website installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: habo-client-v0.1.7-installer
          path: habo-client-amd64-installer.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish v0.1.7 updater assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v6
        with:
          name: build-linux
          path: dist/linux

      - uses: actions/download-artifact@v6
        with:
          name: build-windows
          path: dist/windows

      - name: Sign updater payloads
        env:
          HABO_UPDATE_SIGNING_KEY: ${{ secrets.HABO_UPDATE_SIGNING_KEY }}
        run: |
          go run ./scripts/sign-updates.go \
            dist/linux/update-linux-amd64.gz \
            dist/windows/update-windows-amd64.exe.gz

      - name: Create release and upload signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.7 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Habo Client v0.1.7" \
              --notes "Connection persistence fix. Habo Client now carries the current Habo Hub device token directly into the freshly replaced process during automatic updates, restores it into the normal protected token store before account refresh, and immediately clears the one-shot handoff. This prevents successful auto-updates from unexpectedly returning to the Connect Habo Hub state."
          fi

          gh release upload v0.1.7 \
            dist/linux/update-linux-amd64.gz \
            dist/linux/update-linux-amd64.gz.sig \
            dist/windows/update-windows-amd64.exe.gz \
            dist/windows/update-windows-amd64.exe.gz.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
