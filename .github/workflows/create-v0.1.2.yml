name: Create and publish Habo Client v0.1.2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-v0.1.2.yml

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure v0.1.2 release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.2 already exists"
            exit 0
          fi

          gh release create v0.1.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Habo Client v0.1.2" \
            --notes "Signed updater validation test release. Also fixes the duplicated v in the dashboard version label."

  build:
    uses: ./.github/workflows/build.yml
    with:
      version_ref_name: v0.1.2

  publish:
    name: Sign and publish v0.1.2 updater assets
    needs:
      - create-release
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v6
        with:
          name: build-linux
          path: dist/linux
      - uses: actions/download-artifact@v6
        with:
          name: build-windows
          path: dist/windows
      - uses: actions/download-artifact@v6
        with:
          name: build-darwin
          path: dist/darwin

      - name: Sign updater payloads
        env:
          HABO_UPDATE_SIGNING_KEY: ${{ secrets.HABO_UPDATE_SIGNING_KEY }}
        run: |
          go run ./scripts/sign-updates.go \
            dist/linux/update-linux-amd64.gz \
            dist/windows/update-windows-amd64.exe.gz \
            dist/darwin/update-darwin-amd64.gz

      - name: Upload signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.2 \
            dist/linux/update-linux-amd64.gz \
            dist/linux/update-linux-amd64.gz.sig \
            dist/windows/update-windows-amd64.exe.gz \
            dist/windows/update-windows-amd64.exe.gz.sig \
            dist/darwin/update-darwin-amd64.gz \
            dist/darwin/update-darwin-amd64.gz.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
